[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evomo"
version = "0.1.0"
description = "A learning-first self-evolving agent for ALFWorld"
requires-python = ">=3.10"

[project.optional-dependencies]
alfworld = [
    "alfworld==0.4.2",
    "textworld==1.7.0",
]
qwen = [
    "torch>=2.6",
    "transformers>=4.51,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
